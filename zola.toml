name = "zxc"
type = "page"
page = "zxc.md"
footer_left = "[<span class=\"text-accent font-semibold\">Window 1:</span> <span class=\"text-fg\">zxc</span>] [<span class=\"text-accent font-semibold\">RO</span>]"
