{% component terminal(title="terminal") -%}
<div class="window my-6">
    <div class="window-chrome">
        <span class="dot dot--red"></span>
        <span class="dot dot--yellow"></span>
        <span class="dot dot--green"></span>
        <span class="text-xs text-muted font-mono ml-2">{{ title }}</span>
    </div>
    <div class="window-body">{{ body | safe }}</div>
</div>
{%- endcomponent terminal %}
