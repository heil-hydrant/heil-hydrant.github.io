base_url = "https://minimal-black-demo.netlify.app"
title = "Minimal Black Theme"
description = "A minimal, dark-mode first personal site, or whatever else you want it to be."
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
]

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-dark"
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = true

[search]
include_title = true
include_description = true
include_path = true
include_content = true
truncate_content_length = 300

[extra]
brand = "Zola Minimal Black"
favicon = "/favicon.svg"
apple_touch_icon = "/favicon.svg"
logo = ""
projects_intro = "Selected open-source tools, experiments, and production systems."
blog_intro = "Notes on software engineering, architecture, minimal design, and systems."

# Code block collapse settings (mapped to <html> data attributes)
cb_collapse_enabled = true
cb_collapse_default = "expanded"
cb_collapse_lines = 25
cb_collapse_auto_height = false
cb_collapse_collapsed_height = 320

[extra.manifest]
theme_color = "#ff0000"
background_color = "#000000"
categories = ["portfolio", "blog", "technology"]

[extra.theme]
default_theme = "dark" # Options: "light", "dark", "system"

# Main Header Navigation (ported from .Site.Menus.main)
[[extra.menu_main]]
