<div class="search-overlay" data-search-overlay role="dialog" aria-modal="true" aria-label="Site search">
  <div class="search-overlay-backdrop" data-search-close></div>
  <div class="search-modal">
    <div class="search-input-wrap">
      <i class="fas fa-search text-muted"></i>
      <input
        type="search"
        class="search-input"
        data-search-input
        placeholder="Search posts, projects, and pages... (Esc to close)"
        autocomplete="off"
      />
      <button type="button" class="header-icon-btn" data-search-close aria-label="Close search">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="search-results" data-search-results></div>
  </div>
</div>
