{% extends "base.html" %}

{% block main %}
<section class="layout-page-tight">
  <div class="page-int section-stack">
    <header class="page-header">
      <h1 class="page-header__title">{{ taxonomy.name | capitalize }}</h1>
    </header>
    <div class="tech-carousel">
      {% for term in terms %}
        <a class="tech-pill" href="{{ term.permalink }}">
          <span>#{{ term.name }}</span>
          <span class="text-muted">({{ term.pages | length }})</span>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock main %}
