{% extends "base.html" %}

{% block main %}
<section class="layout-page">

    <h1 class="heading-page" style="font-size: 3rem; color: var(--color-accent);">404</h1>
    <p class="text-muted" style="margin: 0.75rem 0 1.5rem 0;">The page you are looking for does not exist or has been moved.</p>
    <a class="btn-primary-sm" href="{{ config.base_url | default(value='/') }}">Return Home</a>
  </div>
</section>
